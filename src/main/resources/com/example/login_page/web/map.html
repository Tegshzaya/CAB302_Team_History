<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Leaflet (no integrity/crossorigin for WebView compatibility) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* avoid scrollbars in WebView */
            background: #f3f3f3;
        }
        #map {
            position: absolute;
            inset: 0; /* top:0; right:0; bottom:0; left:0 */
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    // Build the map and EXPOSE IT globally so Java can call invalidateSize()
    window.map = L.map('map', { worldCopyJump: true }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(window.map);

    let marker = null, line = null;

    // Click handler → send guess back to Java
    window.map.on('click', e => {
        const { lat, lng } = e.latlng;
        if (marker) marker.setLatLng([lat, lng]);
        else marker = L.marker([lat, lng]).addTo(window.map);
        if (window.app && typeof window.app.onMapClick === 'function') {
            try { window.app.onMapClick(lat, lng); } catch(err) { console.error(err); }
        }
    });

    // Callable from Java to show result
    window.showResultLine = (fromLat, fromLng, toLat, toLng) => {
        try {
            if (line) line.remove();
            line = L.polyline([[fromLat, fromLng], [toLat, toLng]], { weight: 3 }).addTo(window.map);
            window.map.fitBounds([[fromLat, fromLng], [toLat, toLng]], { padding: [30,30] });
        } catch (e) {
            console.error('showResultLine error:', e);
        }
    };

    // Optional: quick debug – prints Leaflet size when page finishes
    setTimeout(() => {
        if (window.map) {
            const s = window.map.getSize();
            console.log('Leaflet initial size:', s.x + 'x' + s.y);
        }
    }, 0);
</script>
</body>
</html>
