name: Historical Art Guesser CI

on:
  push:
    branches: [ main, Prototype_1 ]
  pull_request:
    branches: [ main, Prototype_1 ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Install Xvfb for headless testing
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
    
    - name: Run Unit Tests
      run: |
        echo "🧪 Running Unit Tests..."
        xvfb-run -a ./mvnw test -Dtest="*Test,!*IntegrationTest,!PerformanceTest" -B
        echo "✅ Unit Tests completed"
    
    - name: Run Integration Tests
      run: |
        echo "🔗 Running Integration Tests..."
        xvfb-run -a ./mvnw test -Dtest="*IntegrationTest" -B
        echo "✅ Integration Tests completed"
    
    - name: Run Performance Tests
      run: |
        echo "⚡ Running Performance Tests..."
        xvfb-run -a ./mvnw test -Dtest="PerformanceTest" -B
        echo "✅ Performance Tests completed"
    
    - name: Run All Tests (Summary)
      run: |
        echo "📊 Running Complete Test Suite..."
        xvfb-run -a ./mvnw clean test -B
        echo "✅ All tests completed successfully!"
    
    - name: Generate Test Report
      run: ./mvnw surefire-report:report
      if: always()
    
    - name: Generate Coverage Report
      run: ./mvnw jacoco:report
      if: always()
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/site/
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Test Summary
      run: |
        echo "📈 Test Execution Summary:"
        find target/surefire-reports -name "*.xml" -exec grep -l "testcase" {} \; | wc -l | xargs echo "Test classes executed:"
        find target/surefire-reports -name "*.xml" -exec grep -o "<testcase" {} \; | wc -l | xargs echo "Total tests run:"
        find target/surefire-reports -name "*.xml" -exec grep -o 'failures="[^"]*"' {} \; | grep -v 'failures="0"' | wc -l | xargs echo "Failed tests:"
        find target/surefire-reports -name "*.xml" -exec grep -o 'errors="[^"]*"' {} \; | grep -v 'errors="0"' | wc -l | xargs echo "Error tests:"
        echo "🎯 All test suites: Unit Tests, Integration Tests, Performance Tests"
      if: always()

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Build application
      run: |
        echo "🏗️ Building Historical Art Guesser..."
        ./mvnw clean compile -B
        echo "✅ Build completed successfully!"
    
    - name: Verify build artifacts
      run: |
        if [ -d "target/classes" ]; then
          echo "✅ Build successful - classes generated"
          echo "📁 Generated classes:"
          find target/classes -name "*.class" | head -10
          find target/classes -name "*.class" | wc -l | xargs echo "Total .class files:"
        else
          echo "❌ Build failed - no classes generated"
          exit 1
        fi